<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공통영어2 배열 훈련기 v38 · 시험형 구조 엔진</title>
<style>
 :root{--bg:#f7f9fc;--card:#ffffff;--tx:#182033;--mu:#667085;--bd:#dfe6f1;--ac:#2563eb;--ac2:#4f46e5;--pink:#ec4899;--pinkbg:#fce7f3;--purple:#7c3aed;--purplebg:#ede9fe;--green:#16a34a;--greenbg:#dcfce7;--ok:#16a34a;--no:#ef4444;--warn:#f59e0b;--okb:#ecfdf3;--nob:#fef2f2;--wb:#fffbeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,#f8faff 0%,#f7f9fc 100%);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.55}
.w{max-width:1120px;margin:0 auto;padding:24px 20px 40px}
h1{font-size:23px;letter-spacing:-.03em;margin:0 0 4px;font-weight:850}
.modes{display:flex;gap:8px;margin:14px 0 10px}
.modes button{flex:0 0 auto;min-width:110px;font-size:13px;font-weight:750;padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;box-shadow:0 2px 7px rgba(27,46,80,.04)}
.modes button.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 5px 14px rgba(37,99,235,.18)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.levels button{font-size:13px;font-weight:750;padding:11px 10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;text-align:left;box-shadow:0 2px 7px rgba(27,46,80,.04)}
.levels button.on{border-color:var(--ac);background:#eff6ff;color:#1d4ed8;box-shadow:0 4px 12px rgba(37,99,235,.12)}
.levels button.hell-level{border-color:#6a2d2a;background:#140d0e;color:#ffddd9;box-shadow:0 4px 14px rgba(255,69,58,.08)}
.levels button.hell-level:hover{border-color:#ff453a;background:#1b0f10}
.levels button.hell-level small{color:#aa716e}
.levels button small{display:block;color:var(--mu);font-weight:600;font-size:10px;margin-top:3px}
.vaultbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);margin-bottom:12px;gap:10px;flex-wrap:wrap}
.vaultbar button{font-size:12px;font-weight:700;padding:7px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:13px;margin:0 0 7px;padding:0 2px;font-weight:650}
.bar{height:7px;background:#e7edf6;border-radius:999px;margin-bottom:16px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#4f46e5);border-radius:999px;transition:width .25s ease}
.q{background:var(--card);border:1px solid #dbe3ef;border-radius:18px;padding:18px;box-shadow:0 14px 35px rgba(20,44,90,.08);margin-bottom:12px}
.meta{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--mu);margin-bottom:10px;flex-wrap:wrap}
.tag{background:#f8fafc;border:1px solid var(--bd);border-radius:999px;padding:4px 9px;font-weight:650}
.tag.gt{color:#1d4ed8;border-color:#bfdbfe;background:#eff6ff}
.tag.lvl{font-weight:800;background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
.k{font-size:16px;letter-spacing:-.015em;line-height:1.7}
.lab{font-size:12px;color:var(--mu);font-weight:750;margin:12px 0 6px}
.zone{min-height:64px;border:1.5px dashed #c9d5e6;border-radius:13px;padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start;background:#fbfcff}
.zone.pool{border-style:solid;background:transparent;border-color:transparent;padding:4px 0}
.card-banks{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start;margin-top:2px}
.card-bank{border:1px solid var(--bd);border-radius:15px;padding:12px;background:#fff;box-shadow:0 5px 16px rgba(27,46,80,.045)}
.card-bank .bank-title{font-size:13px;font-weight:850;margin-bottom:4px;color:var(--tx);letter-spacing:-.01em}
.card-bank .bank-help{font-size:11px;color:var(--mu);margin-bottom:9px;line-height:1.5}
.function-zone{display:grid;gap:9px}
.function-group{border:1px solid var(--bd);border-radius:12px;padding:9px;background:#fbfcff}
.function-group:nth-child(1){background:var(--pinkbg);border-color:#f9a8d4}
.function-group:nth-child(2){background:#eff6ff;border-color:#bfdbfe}
.function-group:nth-child(3){background:var(--purplebg);border-color:#c4b5fd}
.function-group:nth-child(4){background:var(--greenbg);border-color:#86efac}
.function-group-title{font-size:11px;font-weight:850;color:var(--tx);margin-bottom:7px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.function-group-title small{font-weight:600;color:var(--mu);text-align:right}
.function-group-items{display:flex;flex-wrap:wrap;gap:6px}
.function-choice{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:7px 10px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:9px;font-size:13px;font-weight:750;cursor:pointer;user-select:none;box-shadow:0 1px 4px rgba(27,46,80,.05)}
.function-group:nth-child(1) .function-choice{border-color:#f9a8d4;color:#be185d}
.function-group:nth-child(2) .function-choice{border-color:#bfdbfe;color:#1d4ed8}
.function-group:nth-child(3) .function-choice{border-color:#c4b5fd;color:#6d28d9}
.function-group:nth-child(4) .function-choice{border-color:#86efac;color:#15803d}
.function-choice:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(27,46,80,.08);background:#fff}
.function-choice.fixed{font-weight:750}.function-choice.form{font-weight:850}.func-count{margin-left:5px;font-size:10px;color:var(--mu);font-weight:800}
.form-mark{font-size:9px;margin-left:4px;opacity:.65}.array-count,.array-progress{display:none}.array-empty{min-height:44px}.pool-empty{height:36px}.function-group.muted{display:none}
.card-bank.function-bank{position:sticky;top:14px}
@media(max-width:820px){.card-banks{grid-template-columns:1fr}.card-bank.function-bank{position:static;order:2}}
@media(max-width:620px){.w{padding:16px 12px 28px}h1{font-size:20px}.levels{grid-template-columns:1fr}.modes button{flex:1}.q{padding:14px;border-radius:15px}.card-bank{padding:10px}.top{font-size:12px}}
.cd{position:relative;display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;font-size:15px;cursor:pointer;user-select:none}
/* v15 spacing fix */
.cd{column-gap:.38em;row-gap:0}
.modal-row{column-gap:20px}
.modal-label{padding-right:8px}
.modal-options{column-gap:12px;row-gap:10px}
.cd{touch-action:none;cursor:grab}.cd.dragging{opacity:.45;transform:scale(.98)}.drop-indicator{display:inline-block;width:3px;min-height:38px;border-radius:2px;background:var(--ac);margin:4px 1px;flex:0 0 3px;align-self:stretch}
.cd.f{border-color:var(--ac)}
.cd .fm{font-size:10px;color:var(--ac);margin-left:6px}
.menu{position:absolute;left:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--ac);border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;z-index:5;min-width:150px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.menu b{font-weight:500;border:1px solid var(--bd);border-radius:6px;padding:4px 9px;font-size:14px}
.menu b:hover{background:var(--ac);color:#fff}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4}
.res{margin-top:12px;border-radius:10px;padding:12px;font-size:14px}
.res.ok{background:var(--okb);color:var(--ok)}
.res.no{background:var(--nob)}
.res.warn{background:var(--wb);color:var(--warn)}
.res .a{color:var(--tx);font-weight:600;margin:4px 0}
.res .e{color:var(--tx);margin-top:6px}
.res .t{font-weight:600}
.res .r{color:var(--mu);font-size:13px;margin-top:6px;border-top:1px solid var(--bd);padding-top:6px}
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--card)}
.vitem .vh{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.vitem .vs{font-size:14px;margin:4px 0}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stats span{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:12px}


body,#q,.k,.lab,.tag,.cd,.btns button,.vaultbar,.levels button{color:var(--tx)}
.lab,.top,.vaultbar{color:var(--mu)}
/* v10 form modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.46);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--card);color:var(--tx);border:1px solid #cbd5e1;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(15,23,42,.22)}
.modal h3{margin:0 0 5px;font-size:17px;color:var(--tx)}
.modal p{margin:0 0 14px;font-size:12px;color:var(--mu)}
.modal-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--bd)}
.modal-row:first-child{border-top:0}
.modal-label{font-weight:700;min-width:130px;margin-right:8px;color:var(--tx);flex:0 0 auto}
.modal-options{display:flex;flex-wrap:wrap;align-items:center;gap:12px;row-gap:10px;column-gap:12px;min-width:0;margin-left:2px}
.modal-option{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-width:72px;margin:0;border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:8px;padding:7px 11px;font-size:13px;line-height:1.25;cursor:pointer}
.modal-option:hover{border-color:#ef4444;background:#fff7f7;color:#b91c1c}
.modal-option.on{border-color:#dc2626;background:#fee2e2;color:#b91c1c;box-shadow:0 0 0 2px rgba(220,38,38,.12);font-weight:800}
.modal-label::after{content:' →';margin-left:4px;color:#94a3b8;font-weight:400}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal-actions button{min-width:72px}
.cd .fm.edit{cursor:pointer;font-size:11px;padding:2px 5px;border:1px solid var(--bd);border-radius:6px;color:var(--ac);margin-left:6px}
.form-token{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;border-radius:6px;padding:2px 3px;}
.form-mini{display:inline-flex;align-items:center;justify-content:center;min-width:30px;min-height:30px;padding:4px 8px;margin-left:2px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--mu);font-size:16px;line-height:1;cursor:pointer;touch-action:manipulation;}
.form-mini:hover{border-color:var(--ac);color:var(--ac);background:var(--card);}
.cd{color:var(--tx);-webkit-text-fill-color:var(--tx)}


.study-note{margin-top:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.study-note h4{margin:0 0 8px;font-size:14px}
.study-note-grid{display:grid;gap:8px}
.study-note-block{padding:9px 10px;border-radius:8px;background:var(--bg);line-height:1.65}
.study-note-block b{display:block;margin-bottom:2px}
.study-note code{background:rgba(128,128,128,.12);padding:1px 4px;border-radius:4px}

 .real-function-bank{position:sticky;top:14px}.real-function-input{display:flex;gap:7px;align-items:center}.real-function-input input{flex:1;min-width:0;height:38px;padding:0 12px;border:1px solid #cfd8e6;border-radius:10px;background:#fff;color:var(--tx);font:inherit;font-size:14px;outline:none;box-sizing:border-box}.real-function-input input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.10)}.real-function-input button{height:38px;padding:0 13px;border:1px solid var(--ac);border-radius:10px;background:var(--ac);color:#fff;font-weight:800;cursor:pointer}.real-function-input button:active{transform:translateY(1px)}.real-function-msg{font-size:11px;color:var(--mu);margin-top:6px;min-height:17px}.real-function-msg.bad{color:#b42318}.real-function-msg.ok{color:#067647}.function-group.phrase-group{border:1px solid #c7d2fe;background:#eef2ff}.function-choice.phrase{background:#eef2ff;border-color:#818cf8;color:#3730a3;font-weight:700}.function-choice.phrase:hover{background:#e0e7ff}

/* v30 배열 영역 강조 */
.array-panel{margin-top:14px;border:1px solid #bfd2f6;border-radius:16px;background:#f8fbff;padding:13px;box-shadow:inset 0 0 0 1px rgba(37,99,235,.03)}
.array-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.array-title{font-size:14px;font-weight:900;color:#1d4ed8;letter-spacing:-.02em}
.array-sub{font-size:11px;color:var(--mu);margin-top:2px;line-height:1.5}
.array-count{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-size:11px;font-weight:800;white-space:nowrap}
.array-guide{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 9px}
.array-guide span{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:8px;background:#fff;border:1px solid #dbe7fb;color:#475569;font-size:10px;font-weight:700}
.array-guide b{color:#2563eb}
.answer-zone{min-height:82px;padding:12px;background:#fff;border:2px dashed #93b4ec;transition:.15s;border-radius:12px}
.answer-zone.drag-active{background:#eff6ff;border-color:#2563eb;box-shadow:inset 0 0 0 2px rgba(37,99,235,.08)}
.array-empty{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc;color:#94a3b8;font-size:12px;font-weight:700;padding:12px}
.array-empty b{color:#64748b}
.pool-zone{padding:9px 0 3px;background:#f8fafc;border:1px dashed #d8e1ee;border-radius:11px;min-height:58px}
.pool-zone .cd{background:#fff;border-color:#cfdbec;box-shadow:0 2px 8px rgba(27,46,80,.05)}
.cd.f{box-shadow:0 3px 10px rgba(37,99,235,.08)}
.cd .ord{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-right:5px;border-radius:50%;background:#eff6ff;border:1px solid #bfdbfe;color:#2563eb;font-size:10px;font-weight:900}
.cd .grip{color:#9aa9bd;font-size:11px;margin-right:5px;letter-spacing:-2px}
@media(max-width:620px){.array-head{align-items:stretch;flex-direction:column}.array-count{align-self:flex-start}}

.card-remove{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:6px;border:1px solid #fecaca;border-radius:7px;background:#fff7f7;color:#dc2626;font-size:14px;font-weight:900;line-height:1;cursor:pointer}
.card-remove:hover{background:#fee2e2;border-color:#fca5a5}
.array-sub,.array-guide,.quiz-status{display:none}
.array-panel{padding:11px}
.array-head{margin-bottom:7px}
.array-title{font-size:13px}
.array-empty{min-height:44px;font-size:11px}

/* ================= HELL MODE ================= */
body.hell-ui{background:#05070b;color:#f8fafc;min-height:100vh}
body.hell-ui .w{max-width:1180px;padding:20px 18px 44px}
body.hell-ui h1{color:#f8fafc;letter-spacing:.02em}
body.hell-ui .w>h1+div{display:none}
body.hell-ui .q{background:transparent;border:0;box-shadow:none;padding:0;margin:0}
body.hell-ui .hell-only{display:block}
.hell-shell{position:relative;min-height:calc(100vh - 130px);overflow:hidden;border:1px solid #252b35;border-radius:24px;padding:24px;background:
 radial-gradient(circle at 50% 0%,rgba(255,59,48,.16),transparent 36%),
 radial-gradient(circle at 10% 90%,rgba(255,69,58,.08),transparent 32%),
 linear-gradient(180deg,#090d14 0%,#05070b 100%);box-shadow:0 30px 90px rgba(0,0,0,.42), inset 0 0 120px rgba(255,59,48,.035)}
.hell-shell:before,.hell-shell:after{content:"";position:absolute;inset:auto;pointer-events:none}
.hell-shell:before{width:380px;height:380px;right:-120px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(255,59,48,.24),transparent 65%);filter:blur(8px)}
.hell-shell:after{left:-80px;bottom:-180px;width:430px;height:430px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,0,.10),transparent 68%);filter:blur(14px)}
.hell-top{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:2;margin-bottom:22px}
.hell-kicker{font-size:12px;letter-spacing:.22em;color:#ff6b62;font-weight:900}
.hell-back{border:1px solid #343b46;background:#0b1018;color:#d7dce4;border-radius:11px;padding:8px 12px;font-weight:800;cursor:pointer}
.hell-count{font-size:11px;color:#7f8a99}
.hell-menu-wrap{position:relative;z-index:2;display:grid;gap:22px;max-width:1060px;margin:0 auto}
.hell-title{font-weight:950;letter-spacing:.14em;text-align:center;font-size:clamp(44px,8vw,86px);line-height:.95;color:#fff;text-shadow:0 0 24px rgba(255,59,48,.32),0 0 58px rgba(255,59,48,.14)}
.hell-sub{text-align:center;color:#a4afbd;font-size:13px;margin-top:-10px}
.hell-warning{margin:0 auto;max-width:700px;text-align:center;color:#ff9e98;font-size:12px;letter-spacing:.06em}
.hell-modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:10px}
.hell-mode-card{position:relative;overflow:hidden;text-align:left;border:1px solid #343b46;border-radius:20px;padding:24px;background:linear-gradient(180deg,rgba(16,21,30,.98),rgba(9,12,17,.98));cursor:pointer;color:#f8fafc;box-shadow:0 16px 35px rgba(0,0,0,.28);transition:transform .16s,box-shadow .16s,border-color .16s}
.hell-mode-card:hover{transform:translateY(-3px);border-color:#ff4d45;box-shadow:0 20px 42px rgba(255,59,48,.12),0 16px 35px rgba(0,0,0,.28)}
.hell-mode-card .icon{font-size:28px;margin-bottom:18px}
.hell-mode-card h2{margin:0 0 7px;font-size:24px;letter-spacing:-.02em}
.hell-mode-card p{margin:0;color:#aab3c0;font-size:12px;line-height:1.7}
.hell-mode-card .rule{margin-top:16px;display:inline-flex;align-items:center;gap:6px;color:#ff6f67;font-size:11px;font-weight:900;letter-spacing:.08em}
.hell-mode-card.master .rule{color:#a6b2ff}
.hell-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.hell-stat{border:1px solid #2b313b;border-radius:14px;background:#090d13;padding:12px}
.hell-stat small{display:block;color:#687585;font-size:10px;margin-bottom:4px}.hell-stat b{display:block;font-size:17px;color:#f8fafc}
.hell-quote{text-align:center;color:#737e8b;font-size:11px;letter-spacing:.05em}
.hell-game{position:relative;z-index:2;display:grid;gap:14px}
.hell-game-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hell-badge{display:inline-flex;align-items:center;gap:8px;color:#ff665d;font-weight:950;letter-spacing:.12em;font-size:12px}.hell-badge span{width:8px;height:8px;border-radius:50%;background:#ff453a;box-shadow:0 0 12px rgba(255,69,58,.7)}
.hell-head-meta{display:flex;align-items:center;gap:10px;color:#98a3b0;font-size:11px}
.hell-head-meta b{color:#f8fafc}
.hell-timer-wrap{display:grid;place-items:center;padding:8px 0 0}
.hell-timer{width:136px;height:136px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(#ff453a var(--pct,100%),#272d36 0);box-shadow:0 0 34px rgba(255,59,48,.13)}
.hell-timer:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#080c12;border:1px solid #2b313b}

function deepCopy(o){return JSON.parse(JSON.stringify(o));}
function cleanSpace(s){return String(s==null?'':s).replace(/\s+/g,' ').trim();}
function low(s){return cleanSpace(s).toLowerCase().replace(/^[,.;:!?]+|[,.;:!?]+$/g,'');}
function norm(s){return cleanSpace(s).toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();}
function htmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function withPunct(c,text){return cleanSpace(text)+(c&&c.punct?c.punct:'');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const ARTICLE={a:1,an:1,the:1};
const MODALS={can:1,could:1,may:1,might:1,must:1,shall:1,should:1,will:1,would:1};
const AUX_FORMS={
  be:['be','am','is','are','was','were','been','being'],
  have:['have','has','had','having'],
  do:['do','does','did','done','doing']
};
const AUX_ROOT_BY_FORM={};
Object.keys(AUX_FORMS).forEach(root=>AUX_FORMS[root].forEach(f=>AUX_ROOT_BY_FORM[f]=root));

function functionClass(token){
  const b=low(token.base),a=low(token.answer);
  if(ARTICLE[b]||ARTICLE[a])return{group:'article',key:(ARTICLE[b]?b:a)};
  if(b==='to'||a==='to')return{group:'to',key:'to'};
  if(MODALS[b]||MODALS[a])return{group:'modal',key:(MODALS[b]?b:a)};
  const root=AUX_ROOT_BY_FORM[b]||AUX_ROOT_BY_FORM[a];
  if(root)return{group:'aux',key:root};
  return null;
}

 ]}
];

const FUNCTION_WORD_INDEX=(()=>{
  const map=new Map();
  const add=(word,key)=>map.set(low(word),{key,word});
  FUNCTION_GROUPS.forEach(g=>g.items.forEach(item=>{
    add(item.key,item.key);
    (item.forms||[]).forEach(f=>add(f,item.key));
  }));
  return map;
})();

  const s=q.sentence||'', lowS=s.toLowerCase();
  const lines=[];
  function add(a,b){if(a&&!lines.includes(a))lines.push(a);if(b&&!lines.includes(b))lines.push(b);}
  function firstMatch(re,fallback){const m=s.match(re);return (m&&m[0]?m[0]:fallback).trim();}

  if(/^if\b/.test(lowS)&&/\bhad\b/.test(lowS)&&/\bwould\b/.test(lowS)){
    const a=firstMatch(/^If\b[^,]{0,45}/i,'If TOMS had adopted a more traditional business model');
    const b=firstMatch(/would\s+not\s+have\s+been\s+possible/i,'would not have been possible');
    add('<b>“'+htmlEsc(a)+'”</b>는 <b>had + p.p.</b>로 과거 사실의 반대를 나타냅니다.','뒤의 <b>“'+htmlEsc(b)+'”</b>는 <b>would + have + p.p.</b> 순서를 그대로 잡으세요.');
  }else if(/not only/.test(lowS)){
    const a=firstMatch(/Not only[^.]{0,45}/i,'Not only does this concept prevent');
    add('<b>“'+htmlEsc(a)+'”</b>처럼 <b>Not only</b>가 앞에 오면 <b>does + 주어 + 동사원형</b>으로 도치됩니다.','따라서 <b>does prevent</b>에서 <b>prevent</b>는 원형입니다.');
  }else if(/\bso\b/.test(lowS)&&/\bthat\b/.test(lowS)){
    const a=firstMatch(/so\s+[^,.;]{0,22}\s+that/i,'so natural that');
    add('<b>“'+htmlEsc(a)+'”</b>는 <b>so + 형용사/부사 + that</b> 결과 구문입니다.','<b>so natural</b>을 먼저 잡고, 그 뒤에 <b>that</b> 결과절을 붙이세요.');
  }else if(/\bto\s+\w+/.test(lowS)){
    const a=firstMatch(/\bto\s+\w+/i,'to achieve');
    add('<b>“'+htmlEsc(a)+'”</b>에서 <b>to</b> 뒤 동사는 원형입니다.','따라서 <b>to achieve</b>처럼 <b>to</b>와 동사원형의 관계를 먼저 확인하세요.');
  }else if(/\b(be|been|being|is|are|was|were)\b/.test(lowS)&&/\b\w+(?:ed|en)\b/.test(lowS)){
    const a=firstMatch(/\b(?:is|are|was|were|be|been|being)\s+\w+(?:ed|en)\b/i,'is defined');
    add('<b>“'+htmlEsc(a)+'”</b>처럼 <b>be + p.p.</b>가 붙으면 수동태인지 먼저 확인하세요.','예를 들어 <b>is defined</b>에서는 <b>defined</b>만 따로 본동사로 잡지 않습니다.');
  }else if(/\b(?:does|do|did|can|could|may|might|must|should|will|would)\b/.test(lowS)){
    const a=firstMatch(/\b(?:does|do|did|can|could|may|might|must|should|will|would)\s+\w+/i,'does tend');
    add('<b>“'+htmlEsc(a)+'”</b>에서는 조동사 뒤에 <b>동사원형</b>이 옵니다.','예를 들어 <b>does tend</b>에서는 <b>does</b>가 수·시제를 담당합니다.');
  }else if(/\bwith\b/.test(lowS)&&/\b\w+ing\b/.test(lowS)){
    const a=firstMatch(/with\s+[^,.;]{0,32}\w+ing/i,'with dogs providing');
    add('<b>“'+htmlEsc(a)+'”</b>에서는 <b>with + 명사 + -ing</b> 구조를 확인하세요.','<b>dogs providing</b>처럼 명사와 -ing의 관계를 먼저 잡으면 됩니다.');
  }else if(/\b(accuse\w*)\b/.test(lowS)&&/\bof\b/.test(lowS)){
    const a=firstMatch(/accus\w*\s+[^.]{0,35}\bof\b/i,'accusing him of');
    add('<b>“'+htmlEsc(a)+'”</b>에서 <b>accuse A of B</b> 구조를 찾으세요.','<b>of</b> 뒤에는 <b>-ing</b>가 이어지는지 확인하세요.');
  }else{
    const words=s.split(/\s+/).slice(0,6).join(' ');
    add('<b>“'+htmlEsc(words)+'”</b>에서 먼저 <b>주어와 핵심 동사</b>를 찾으세요.','명사 덩어리 → 동사 → 목적어/보어 순서로 뼈대를 잡은 뒤 나머지를 붙이면 됩니다.');
  }
  return '<div class="e"><b>핵심 포인트</b><br>• '+lines.slice(0,2).join('<br>• ')+'</div>';
}

/* ---------- 1. Source Model: 원문 토큰은 여기서 단 한 번만 정의 ---------- */
function buildQuestion(raw){
  const q=deepCopy(raw);
  q.tokens=q.baseCards.map((c,i)=>({
    id:q.id+'__t'+i,
    sourceIndex:i,
    type:c.type,
    base:c.base,
    answer:c.answer,
    forms:(c.forms||[]).slice(),
    punct:c.punct||''
  }));
  q.sentence=q.tokens.map(t=>withPunct(t,t.answer)).join(' ')
    .replace(/\s+([,;.:)])/g,'$1')
    .replace(/\(\s+/g,'(');
  if(!/[.!?]$/.test(q.sentence))q.sentence+='.';
  return q;
}
const DATA=RAW_DATA.map(buildQuestion);

/* ---------- 2. Function classification: 기능어를 제거해도 경계는 유지 ---------- */
function isFunctionToken(t){return functionClass(t)!==null;}

/* ---------- 3. Medium/Hard Chunk Engine ---------- */
const CLAUSE_WORDS={if:1,when:1,while:1,although:1,though:1,because:1,since:1,unless:1,whereas:1,where:1,which:1,who:1,that:1,as:1,before:1,after:1,until:1,once:1,whenever:1};
const COORD_WORDS={and:1,but:1,or:1,yet:1};
const PREP_WORDS={of:1,in:1,on:1,at:1,by:1,with:1,for:1,from:1,without:1,against:1,into:1,through:1,over:1,under:1,between:1,among:1,toward:1,towards:1,as:1};
const SUBJECT_PRONOUNS={i:1,you:1,he:1,she:1,it:1,we:1,they:1,this:1,that:1,these:1,those:1,who:1,which:1,what:1};

function makeCoreChunks(tokens,level,idSeed){
  const out=[]; let idSeedLocal=idSeed;
  function make(group){
    if(!group.length)return;
    const vars=group.filter(t=>t.type==='v').map(t=>({sourceIndex:t.sourceIndex,base:t.base,answer:t.answer,forms:(t.forms&&t.forms.length?t.forms:[t.answer]).slice(),punct:t.punct}));
    out.push({
      id:'c'+(idSeedLocal++),
      kind:'core',
      sourceIndexes:group.map(t=>t.sourceIndex),
      rawTokens:group.map(t=>({...t})),
      varSpecs:vars,
      tokenCount:group.length
    });
  }
  if(level==='hard'){tokens.forEach(t=>make([t]));return out;}

  // 보통: 의미단위 우선. 동사는 항상 독립 카드.
  // 경계 우선순위: 동사 > 절/접속 > 전치사구 > 주어 대명사 > 자연스러운 내용어 덩어리.
  let run=[];
  function flush(){if(run.length){make(run);run=[];}}
  function pushAndMaybeSplit(t){
    run.push(t);
    if(t.punct){flush();return true;}
    if(run.length>=5){flush();return true;}
    return false;
  }

  let i=0;
  while(i<tokens.length){
    const t=tokens[i], w=low(t.base);

    // 동사는 언제나 단독.
    if(t.type==='v'){flush();make([t]);i++;continue;}

    // 절/등위 접속사는 앞뒤 의미단위를 갈라 준다.
    if(CLAUSE_WORDS[w]||COORD_WORDS[w]){flush();make([t]);i++;continue;}

    // 대명사 주어 + 동사: 주어는 따로 두어 핵심 구조가 눈에 보이게 한다.
    if(SUBJECT_PRONOUNS[w]&&i+1<tokens.length&&tokens[i+1].type==='v'){
      flush();make([t]);i++;continue;
    }

    // 전치사구는 전치사부터 다음 의미어까지 한 덩어리.
    if(PREP_WORDS[w]){
      flush();
      let g=[t]; i++;
      while(i<tokens.length){
        const u=tokens[i],uw=low(u.base);
        if(u.type==='v'||CLAUSE_WORDS[uw]||COORD_WORDS[uw]||PREP_WORDS[uw])break;
        if(SUBJECT_PRONOUNS[uw]&&i+1<tokens.length&&tokens[i+1].type==='v')break;
        if(g.length>=5)break;
        g.push(u); i++;
        if(u.punct)break;
      }
      make(g); continue;
    }

    // 일반 내용어: 붙여 읽어도 자연스러운 범위만 묶는다.
    pushAndMaybeSplit(t); i++;
  }
  flush();
  return out;
}

function buildSession(q,level){
  const session={
    level,
    items:{},
    poolIds:[],
    answerIds:[],
    sourceTokenCount:q.tokens.length,
    functionRequired:[],
    functionCounts:{}
  };
  let seed=0,run=[];
  function flushRun(){
    if(!run.length)return;
    const made=makeCoreChunks(run,level,seed);
    made.forEach(item=>{
      const n=parseInt(item.id.slice(1),10);seed=Math.max(seed,n+1);
      item.baseText=item.rawTokens.map(t=>withPunct(t,t.base)).join(' ').replace(/\s+([,;.:)])/g,'$1');
      item.answerText=item.rawTokens.map(t=>withPunct(t,t.answer)).join(' ').replace(/\s+([,;.:)])/g,'$1');
      item.varSpecs.forEach(v=>v.selected=v.base);
      session.items[item.id]=item;
      session.poolIds.push(item.id);
    });
    run=[];
  }

  q.tokens.forEach(t=>{
    const fc=functionClass(t);
    if(fc){
      // 핵심: 기능어가 제거되는 순간 flush -> 앞뒤 단어 절대 합치지 않음
      flushRun();
      session.functionRequired.push({...fc,sourceIndex:t.sourceIndex,sourceTokenId:t.id,answer:t.answer,punct:t.punct});
      session.functionCounts[fc.key]=(session.functionCounts[fc.key]||0)+1;
    }else run.push(t);
  });
  flushRun();
  session.poolIds=shuffle(session.poolIds);
  return session;
}

function hellCheckTime(){
  if(hellState!=='solving')return;
  if(sessionState.poolIds.length||answerTokenCount()!==sessionState.sourceTokenCount)return;
  clearHellTimer();
  const diff=hellDiffData();
  const exactWords=diff.got.length===diff.target.length && diff.got.every((w,i)=>w===diff.target[i]);
  if(exactWords){
    const elapsed=Math.min(120,120-hellRemaining);
    hellCombo++;
    hellBossHp=Math.max(0,hellBossHp-1);
    if(!hellStats.timeBest||elapsed<hellStats.timeBest)hellStats.timeBest=elapsed;
    saveHellStats();hellState='clear';renderHellClear(elapsed);return;
  }
  hellCombo=0;hellState='fail';renderHellResult('fail');
}

function hellDiffToken(s){
  // 채점에서는 문장부호를 단어와 분리한다.
  // 예: matter— / matter, / matter. 모두 같은 단어 "matter"로 취급.
  return String(s==null?'':s)
    .toLowerCase()
    .replace(/[“”„‟]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi,'')
    .trim();
}
function hellDiffData(){
  // 채점용 토큰은 문장부호를 완전히 무시한다.
  // matter— / matter, / matter. / matter 는 모두 같은 "matter"다.
  const targetRaw=hellCurrent.tokens.map(t=>withPunct(t,t.answer)).filter(Boolean);
  const gotRaw=[];
  sessionState.answerIds.forEach(id=>itemTokenWords(sessionState.items[id]).forEach(w=>gotRaw.push(w)));
  const target=targetRaw.map(hellDiffToken).filter(Boolean);
  const got=gotRaw.map(hellDiffToken).filter(Boolean);
  const gotMatched=new Array(got.length).fill(false);
  const targetMatched=new Array(target.length).fill(false);

  // 1) 단어 수가 같고 정규화한 문장이 완전히 같으면 무조건 정답.
  //    쉼표/마침표/대시 때문에 오답으로 잡히는 일을 원천 차단한다.
  if(got.length===target.length && got.every((w,i)=>w===target[i])){
    gotMatched.fill(true);
    targetMatched.fill(true);
    return {target,targetRaw,got,gotRaw,gotMatched,targetMatched};
  }

  // 2) 단어 수가 다를 때만 LCS로 누락/추가 단어를 찾는다.
  const n=got.length,m=target.length;
  const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=got[i]===target[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);

  let i=0,j=0;
  while(i<n&&j<m){
    if(got[i]===target[j]){
      gotMatched[i]=true;
      targetMatched[j]=true;
      i++;j++;
    }else if(dp[i+1][j]===dp[i][j+1]){
      // 동률에서는 같은 위치의 단어를 우선 비교한다.
      i++;j++;
    }else if(dp[i+1][j]>dp[i][j+1]) i++;
    else j++;
  }
  return {target,targetRaw,got,gotRaw,gotMatched,targetMatched};
}
function hellDiffHtml(){
  const d=hellDiffData();
  const user=d.got.length
    ? d.got.map((w,i)=>'<span class="'+(d.gotMatched[i]?'hell-word-ok':'hell-word-wrong')+'">'+htmlEsc(d.gotRaw[i])+'</span>').join(' ')
    : '<span class="hell-empty-answer">아직 입력한 답이 없습니다.</span>';
  const missingIdx=d.target.map((w,i)=>!d.targetMatched[i]?i:-1).filter(i=>i>=0);
  const extraIdx=d.got.map((w,i)=>!d.gotMatched[i]?i:-1).filter(i=>i>=0);
  let detail='';

function checkHellMaster(){
  if(hellState!=='masterSolving')return;
  const input=document.getElementById('hellMasterInput')?.value||'';
  const got=masterTokens(input),target=hellCurrent.tokens.map(t=>masterNormalize(t.answer)).filter(Boolean);
  const n=Math.max(got.length,target.length);
  let exact=0;
  for(let i=0;i<Math.min(got.length,target.length);i++) if(got[i]===target[i]) exact++;
  const pct=n?Math.round(exact/n*100):0;
  const strict=masterNormalize(input)===masterNormalize(hellCurrent.sentence);
  const minorEnough=pct>=90&&!strict;
  if(strict){
    hellMasterStreak++;
    hellStats.masterBest=Math.max(hellStats.masterBest,pct);
    hellStats.masterBestStreak=Math.max(hellStats.masterBestStreak,hellMasterStreak);
    saveHellStats();
    renderHellMasterResult(true,pct,got,target,{strict:true});
    return;
  }
  if(minorEnough){
    hellState='masterDecision';
    hellStats.masterBest=Math.max(hellStats.masterBest,pct);
    saveHellStats();
    renderHellMasterResult(false,pct,got,target,{decision:true});
    return;
  }
  hellMasterStreak=0;
  hellStats.masterBest=Math.max(hellStats.masterBest,pct);
  saveHellStats();
  renderHellMasterResult(false,pct,got,target,{decision:false});
}

function itemSelected(item){
  if(item.kind==='function')return item.varSpecs.length?(item.selected&&item.selected.length?item.selected:item.varSpecs.map(v=>v.base)):[];
  return item.varSpecs.map(v=>v.selected||v.base);
}

function itemText(item){
  if(item.kind==='function'){
    if(item.varSpecs.length)return withPunct(item.varSpecs[0],itemSelected(item)[0]||item.varSpecs[0].base);
    return item.baseText;
  }
  const selected=itemSelected(item);let vi=0;
  return item.rawTokens.map(t=>{
    const shown=t.type==='v'?(selected[vi++]||t.base):t.base;
    return withPunct(t,shown);
  }).join(' ').replace(/\s+([,;.:)])/g,'$1');
}
function itemBaseText(item){
  if(item.kind==='function')return item.varSpecs.length?item.varSpecs[0].base:item.baseText;
  return item.rawTokens.map(t=>withPunct(t,t.base)).join(' ').replace(/\s+([,;.:)])/g,'$1');
}
function itemTokenWords(item){
  return itemText(item).replace(/[.,!?;:]+$/,'').split(/\s+/).filter(Boolean);
}
function answerTokenCount(){
  return sessionState.answerIds.reduce((n,id)=>n+(sessionState.items[id]?.tokenCount||0),0);
}

function answerControls(pos){ return '<button type="button" class="card-remove" data-remove="1" aria-label="카드를 단어 칸으로 되돌리기">×</button>'; }

function cardInner(item,where,previewSelections){
  const selected=previewSelections||itemSelected(item);
  if(item.kind==='function'){
    if(item.varSpecs.length){
      const shown=(selected[0]||item.varSpecs[0].base);
      return htmlEsc(shown);
    }
    // 기능어 카드는 이름을 한 번만 표시한다. 그룹명(a/the/to 등)을 옆에 반복하지 않는다.
    return htmlEsc(item.baseText);
  }

  let vi=0;
  return item.rawTokens.map(t=>{
    if(t.type==='v'){
      const shown=where==='pool'?t.base:(selected[vi]||t.base);
      vi++;
      return htmlEsc(shown);
    }
    return htmlEsc(t.base+(t.punct||''));
  }).join(' ');
}

function renderCard(item,where,pos){
  let inner=cardInner(item,where);
  if(where==='put')inner+=answerControls(pos);
  return '<span class="cd '+(where==='put'?'f put-card':'')+'" data-w="'+where+'" data-id="'+htmlEsc(item.id)+'">'+inner+'</span>';

  item.selected=modalState.selections.slice();
  item.varSpecs.forEach((v,i)=>v.selected=item.selected[i]||v.base);
  const shouldInsert=modalState.moveToAnswer && sessionState.poolIds.includes(item.id);

/* ---------- 8. Answer / diagnostics ---------- */
function flattenAnswer(){
  const arr=[];
  sessionState.answerIds.forEach(id=>itemTokenWords(sessionState.items[id]).forEach(w=>arr.push(low(w))));
  return arr.filter(Boolean);
}
function flattenTarget(){return cur.tokens.map(t=>low(t.answer)).filter(Boolean);}
function isCorrect(){
  const a=flattenAnswer(),b=flattenTarget();
  return a.length===b.length&&a.every((x,i)=>x===b[i]);
}
function diagnose(){
  const target=flattenTarget(),got=flattenAnswer();
  const required={};cur.tokens.forEach(t=>{const fc=functionClass(t);if(fc)required[fc.key]=(required[fc.key]||0)+1;});
  const placed={};sessionState.answerIds.map(id=>sessionState.items[id]).filter(Boolean).forEach(it=>{if(it.kind==='function')placed[it.functionKey]=(placed[it.functionKey]||0)+1;});
  const missing=Object.keys(required).find(k=>(placed[k]||0)<required[k]);
  if(missing)return{type:'function',msg:'「'+missing+'」가 필요한데 아직 넣지 않았어. 이 기능어를 넣을 위치를 문장 구조로 다시 찾아봐.'};
  let i=0;while(i<got.length&&i<target.length&&got[i]===target[i])i++;
  if(i<target.length){
    const start=Math.max(0,i-2),end=Math.min(target.length,i+3);
    const near=cur.tokens.slice(start,end).map(t=>t.answer).join(' ');
    const user=got.slice(start,Math.min(got.length,i+3)).join(' ');
    return{type:'position',msg:'「'+near+'」 주변을 다시 봐. 지금 배열한 「'+(user||'')+'」이(가) 그 앞뒤 구조에 맞는지 확인해봐.'};
  }
  if(got.length!==target.length)return{type:'count',msg:'카드 수가 맞지 않아. 기능어를 한 번 더 넣었거나 아직 하나가 남아 있는지 확인해봐.'};
  return{type:'general',msg:'동사 어형과 앞뒤 단어의 연결을 다시 확인해봐.'};
}

function loadVault(){try{return JSON.parse(localStorage.getItem(VKEY))||[]}catch(e){return[]}}
function saveVault(v){try{localStorage.setItem(VKEY,JSON.stringify(v))}catch(e){}}

function vaultFind(id){return vault.findIndex(v=>v.qid===id);}
function addToVault(item,lastError){
  const i=vaultFind(item.id),old=i>=0?vault[i]:null;
  const entry={qid:item.id,sentence:item.sentence,k:item.korean,tags:item.tags,source:item.source,sourceType:item.sourceType,session:reviewMode?reviewLevel:curLevel,wrongCount:(old?old.wrongCount+1:1),lastError:lastError?.msg||''};
  if(i>=0)vault[i]=entry;else vault.push(entry);saveVault(vault);
}
function removeFromVault(qid){const i=vaultFind(qid);if(i>=0){vault.splice(i,1);saveVault(vault)}}

function loadProgress(){
  try{
    const saved=JSON.parse(localStorage.getItem(PKEY)||'{}'),o={};
    LORDER.forEach(lv=>{
      const s=saved[lv]||{};
      o[lv]={order:Array.isArray(s.order)&&s.order.length===DATA.length?s.order.slice():shuffle(DATA.map((_,i)=>i)),i:Number.isFinite(s.i)?s.i:0,score:Number.isFinite(s.score)?s.score:0,tot:DATA.length};
    });
    return o;
  }catch(_){
    const o={};LORDER.forEach(lv=>o[lv]={order:shuffle(DATA.map((_,i)=>i)),i:0,score:0,tot:DATA.length});return o;
  }
}

/* ---------- 10. Session lifecycle ---------- */
function currentQuestion(){
  if(reviewMode)return DATA.find(d=>d.id===reviewQueue[reviewIdx])||null;
  const st=LS[curLevel];return DATA[st.order[Math.min(st.i,DATA.length-1)]]||null;
}
function loadQuestion(){
  cur=currentQuestion();
  if(!cur)return;
  sessionState=buildSession(cur,reviewMode?reviewLevel:curLevel);
  attempts=0;state='solving';lastDiag=null;dragInfo=null;dropIndex=null;suppressClick=false;
  render();
}
function resetQuestion(){
  if(!cur)return;
  sessionState=buildSession(cur,reviewMode?reviewLevel:curLevel);
  attempts=0;state='solving';lastDiag=null;
  render();
}
function showAnswerNow(){state='answer';render();}
function onCheck(){
  if(sessionState.poolIds.length>0||answerTokenCount()!==sessionState.sourceTokenCount)return;
  if(isCorrect()){
    state='correct';
    if(reviewMode)removeFromVault(cur.id);else{LS[curLevel].score++;saveProgress();}
    render();return;
  }
  attempts++;
  cur.wrongCount=(cur.wrongCount||0)+1;
  if(attempts===1){state='wrong1';render();return;}
  lastDiag=diagnose();
  if(attempts===2){state='wrong2';render();return;}
  state='revealed';addToVault(cur,lastDiag);render();
}
function nextQuestion(){
  if(reviewMode){
    reviewQueue.splice(reviewIdx,1);
    if(!reviewQueue.length){reviewMode=false;loadQuestion();return;}
    reviewIdx=Math.min(reviewIdx,reviewQueue.length-1);
    reviewLevel=(vault.find(v=>v.qid===reviewQueue[reviewIdx])||{}).session||'hard';
    loadQuestion();return;
  }
  const st=LS[curLevel];st.i++;
  if(st.i>=DATA.length){
    st.i=DATA.length;saveProgress();
    document.getElementById('q').innerHTML='<div class="k" style="text-align:center;padding:24px 0">'+LNAME[curLevel]+' 단계 완료! '+DATA.length+'문제 중 <b>'+st.score+'</b>문제 정답<div class="btns" style="justify-content:center"><button class="p" id="restartLevel">↻ 다시 섞어서 풀기</button></div></div>';
    renderLevels();renderLvlStat();return;
  }
  saveProgress();loadQuestion();
}

/* ---------- 12. Drag & Drop ---------- */
function clearIndicator(){const old=document.getElementById('dropIndicator');if(old?.parentNode)old.parentNode.removeChild(old);dropIndex=null;}
function insertionIndex(x,y,ignoreId=null){
  const z=document.getElementById('answerZone');
  if(!z)return 0;
  const els=[...z.querySelectorAll('.cd[data-w="put"]')].filter(el=>!ignoreId||el.dataset.id!==ignoreId);
  if(!els.length)return 0;

  const rects=els.map((el,i)=>({i,r:el.getBoundingClientRect()}));
  const rows=[];
  rects.forEach(item=>{
    let row=rows.find(g=>Math.abs(g.top-item.r.top)<12);
    if(!row){row={top:item.r.top,bottom:item.r.bottom,items:[]};rows.push(row);}
    row.items.push(item);
    row.top=Math.min(row.top,item.r.top);
    row.bottom=Math.max(row.bottom,item.r.bottom);
  });
  rows.sort((a,b)=>a.top-b.top);
  rows.forEach(row=>row.items.sort((a,b)=>a.r.left-b.r.left));

  let row=rows.find(g=>y>=g.top-10&&y<=g.bottom+10);
  if(!row){
    let best=null;
    for(const g of rows){
      const d=y<g.top?g.top-y:(y>g.bottom?y-g.bottom:0);
      if(!best||d<best.d)best={g,d};
    }
    row=best?best.g:rows[0];
  }

  const items=row.items;
  for(const item of items){
    if(x<item.r.left+item.r.width/2)return item.i;
  }

  const rowIdx=rows.indexOf(row);
  const nextRow=rows[rowIdx+1];
  if(nextRow && y>row.bottom){
    const nextFirst=nextRow.items[0];
    if(y < nextFirst.r.top + nextFirst.r.height/2)return nextFirst.i;
  }
  return items[items.length-1].i+1;
}
function showIndicator(idx,ignoreId=null){
  const z=document.getElementById('answerZone');if(!z)return;
  let ind=document.getElementById('dropIndicator');
  if(!ind){ind=document.createElement('span');ind.id='dropIndicator';ind.className='drop-indicator';}
  const cards=[...z.querySelectorAll('.cd[data-w="put"]')].filter(el=>!ignoreId||el.dataset.id!==ignoreId);
  if(idx>=cards.length)z.appendChild(ind);else z.insertBefore(ind,cards[idx]);
  dropIndex=idx;
}
function finishDrag(x,y,cancel){
  const z=document.getElementById('answerZone');if(z)z.classList.remove('drag-active');
  if(!dragInfo)return;
  const info=dragInfo;if(info.el)info.el.classList.remove('dragging');
  if(cancel){clearIndicator();dragInfo=null;return;}
  if(!z){dragInfo=null;return;}
  const r=z.getBoundingClientRect();
  if(x<r.left-20||x>r.right+20||y<r.top-20||y>r.bottom+20){clearIndicator();dragInfo=null;return;}

  const ignoreId=info.from==='put'?info.id:null;
  const idx=insertionIndex(x,y,ignoreId);
  clearIndicator();
  if(info.from==='pool'){
    insertFromPool(info.id,idx);
  }else{
    const old=sessionState.answerIds.indexOf(info.id);
    if(old<0){dragInfo=null;return;}
    sessionState.answerIds.splice(old,1);
    const finalIdx=Math.max(0,Math.min(idx,sessionState.answerIds.length));
    sessionState.answerIds.splice(finalIdx,0,info.id);
  }
  dragInfo=null;suppressClick=true;render();
}
function insertFromPool(id,index){
  const p=sessionState.poolIds.indexOf(id);if(p<0)return;
  sessionState.poolIds.splice(p,1);
  index=Math.max(0,Math.min(index,sessionState.answerIds.length));
  sessionState.answerIds.splice(index,0,id);
}
function removeFromAnswer(id){
  const i=sessionState.answerIds.indexOf(id);if(i<0)return;
  const item=sessionState.items[id];
  sessionState.answerIds.splice(i,1);
  if(item&&item.kind==='function'){
    // 기능어는 X로 제거하면 재료함으로 되돌리지 않고 삭제한다.
    // 그러면 기능어 선택 버튼의 개수가 다시 활성화된다.
    delete sessionState.items[id];
    return;
  }
  sessionState.poolIds.push(id);
}
function moveAnswerByPos(pos,delta){
  const j=pos+delta;if(pos<0||j<0||j>=sessionState.answerIds.length)return;
  [sessionState.answerIds[pos],sessionState.answerIds[j]]=[sessionState.answerIds[j],sessionState.answerIds[pos]];
}

  const t=e.target;
  if(t.id==='chk'){onCheck();return;}
  if(t.id==='answerNow'){showAnswerNow();return;}
  if(t.id==='rs'||t.id==='retry'){resetQuestion();return;}
  if(t.id==='nx'){nextQuestion();return;}
  if(t.id==='restartLevel'){return;}
  if(t.id==='realFunctionAdd'){
    const input=document.getElementById('realFunctionInput');
    if(input)addRealFunctionWord(input.value);
    return;
  }
  if(t.dataset.func){addFunctionCard(t.dataset.func);return;}
  const rm=t.closest('.card-remove');
  if(rm){const card=rm.closest('.cd');if(card){removeFromAnswer(card.dataset.id);render();}return;}
  if(!['solving','wrong1','wrong2'].includes(state))return;
  const card=t.closest('.cd');if(!card)return;
  const item=sessionState.items[card.dataset.id];if(!item)return;

  // 활용형이 있는 카드(be/have/do 또는 일반 동사)는 본체를 누르면 어형 선택.
  // X 버튼은 별도로 분리되어 있으므로 카드 전체를 눌러도 제거되지 않는다.
  if(item.varSpecs && item.varSpecs.length){
    openFormModal(item.id,card.dataset.w==='pool');
    return;
  }

  // 일반 카드만 클릭으로 배열에 들어간다.
  if(card.dataset.w==='pool'){insertFromPool(item.id,sessionState.answerIds.length);render();}
});

(function validateAll(){
  const errs=[];
  DATA.forEach(q=>{
    if(q.tokens.length!==q.baseCards.length)errs.push(q.id+': 토큰 수 불일치');
    const rebuilt=q.tokens.map(t=>withPunct(t,t.answer)).join(' ').replace(/\s+([,;.:)])/g,'$1');
    if(norm(rebuilt)!==norm(q.sentence))errs.push(q.id+': 원문 재구성 불일치');
    q.tokens.forEach(t=>{
      if(t.type==='v'&&!t.forms.includes(t.answer))errs.push(q.id+': '+t.base+' 정답 어형 누락');
    });
    ['medium','hard'].forEach(level=>{
      const s=buildSession(q,level);
      const coreSource=new Set();
      Object.values(s.items).forEach(it=>{if(it.kind==='core')it.sourceIndexes.forEach(ix=>coreSource.add(ix));});
      q.tokens.forEach(t=>{
        const fn=functionClass(t),covered=coreSource.has(t.sourceIndex);
        if(fn&&covered)errs.push(q.id+'/'+level+': 기능어가 core에 섞임');
        if(!fn&&!covered)errs.push(q.id+'/'+level+': 일반 토큰이 core에서 누락');
      });
      const fsum=Object.values(s.functionCounts).reduce((a,b)=>a+b,0);
      if(fsum!==s.functionRequired.length)errs.push(q.id+'/'+level+': 기능어 수 집계 오류');
    });
  });
  if(errs.length)console.error('[v40 구조 검증 실패]',errs);

})();

    list.innerHTML='<div style="color:#98a2b3;font-size:13px">불러오는 중...</div>';
    const {data,error}=await sb.from('announcements').select('id,title,content,is_active,created_at,updated_at').order('created_at',{ascending:false});
    if(error){list.innerHTML='<div style="color:#b42318;font-size:13px;white-space:pre-wrap">공지 목록을 불러오지 못했습니다.\n'+esc(error.message)+'</div>';return;}
    if(!data||!data.length){list.innerHTML='<div style="padding:14px;border:1px dashed #dfe6f1;border-radius:10px;color:#98a2b3;font-size:13px">등록된 공지가 없습니다.</div>';return;}
    list.innerHTML=data.map(x=>'<div style="border:1px solid #e7ecf3;border-radius:12px;padding:12px 13px;background:#fbfcfe">'
      +'<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">'
      +'<div style="min-width:0;flex:1"><div style="font-weight:850;color:#182033;overflow-wrap:anywhere">'+esc(x.title)+'</div><div style="margin-top:5px;color:#667085;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(x.content)+'</div><div style="margin-top:7px;color:#98a2b3;font-size:11px">'+formatDate(x.created_at)+' · '+(x.is_active?'게시 중':'비활성')+'</div></div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" data-notice-action="edit" data-id="'+x.id+'" style="border:1px solid #dfe6f1;background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer">수정</button><button type="button" data-notice-action="toggle" data-id="'+x.id+'" style="border:1px solid #dfe6f1;background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer">'+(x.is_active?'비활성화':'게시')+'</button><button type="button" data-notice-action="delete" data-id="'+x.id+'" style="border:1px solid #fecaca;background:#fff;color:#b42318;border-radius:8px;padding:7px 9px;cursor:pointer">삭제</button></div>'
      +'</div></div>').join('');
    list.querySelectorAll('[data-notice-action]').forEach(btn=>btn.addEventListener('click',()=>{
      const id=btn.dataset.id,action=btn.dataset.noticeAction;
      const row=data.find(x=>String(x.id)===String(id));
      if(action==='edit') startEdit(row);
      if(action==='toggle') toggleNotice(row);
      if(action==='delete') deleteNotice(row);
    }));
  }

  function startEdit(row){
    if(!row)return;
    editingId=row.id;
    document.getElementById('noticeTitleInput').value=row.title||'';
    document.getElementById('noticeContentInput').value=row.content||'';
    document.getElementById('noticeActiveInput').checked=!!row.is_active;
    document.getElementById('noticeSaveBtn').textContent='공지 수정';
    document.getElementById('noticeCancelEditBtn').style.display='inline-block';
    showAdminMsg('수정할 공지를 불러왔습니다.',true);
    document.getElementById('noticeTitleInput').focus();
  }

  async function saveNotice(){
    if(currentRole!=='admin'){showAdminMsg('관리자 권한이 필요합니다.',false);return;}
    const title=document.getElementById('noticeTitleInput').value.trim();
    const content=document.getElementById('noticeContentInput').value.trim();
    const is_active=document.getElementById('noticeActiveInput').checked;
    if(!title||!content){showAdminMsg('제목과 내용을 입력하세요.',false);return;}
    const btn=document.getElementById('noticeSaveBtn');btn.disabled=true;btn.style.opacity='.65';
    let r;
    try{
      r=editingId
        ?await sb.from('announcements').update({title,content,is_active,updated_at:new Date().toISOString()}).eq('id',editingId)
        :await sb.from('announcements').insert({title,content,is_active});
    }catch(e){r={error:e};}
    btn.disabled=false;btn.style.opacity='1';
    if(r?.error){showAdminMsg('저장 실패: '+(r.error.message||String(r.error)),false);return;}
    showAdminMsg(editingId?'공지사항을 수정했습니다.':'공지사항을 등록했습니다.',true);
    resetForm();
    await loadAdminList();
    await loadLatestNotice();
  }

  async function toggleNotice(row){
    if(!row)return;
    const next=!row.is_active;
    const {error}=await sb.from('announcements').update({is_active:next,updated_at:new Date().toISOString()}).eq('id',row.id);
    if(error){showAdminMsg('게시 상태 변경 실패: '+error.message,false);return;}
    showAdminMsg(next?'공지를 게시했습니다.':'공지를 비활성화했습니다.',true);
    await loadAdminList();
    await loadLatestNotice();
  }

  async function deleteNotice(row){
    if(!row)return;
    if(!window.confirm('이 공지를 삭제할까요?'))return;
    const {error}=await sb.from('announcements').delete().eq('id',row.id);
    if(error){showAdminMsg('삭제 실패: '+error.message,false);return;}
    if(String(editingId)===String(row.id))resetForm();
    showAdminMsg('공지를 삭제했습니다.',true);
    await loadAdminList();
    await loadLatestNotice();
  }

  async function refreshUserRole(){
    if(!currentUser){currentRole='user';addAdminButton();return;}
    const {data,error}=await sb.from('profiles').select('role').eq('id',currentUser.id).maybeSingle();
    if(error){console.warn('[Profile role]',error.message);currentRole='user';}
    else currentRole=data?.role||'user';
    addAdminButton();
  }

  async function syncUI(user){
    currentUser=user||null;
    await refreshUserRole();
    ensureNoticeBox();
    await loadLatestNotice();
  }

  function openAdminPanel(){
    if(currentRole!=='admin'){return;}
    ensureAdminPanel();
    document.getElementById('noticeAdminModal').style.display='flex';
    showAdminMsg('',true);
    resetForm();
    loadAdminList();
  }
  function closeAdminPanel(){
    const d=document.getElementById('noticeAdminModal');if(d)d.style.display='none';
  }

  ensureNoticeBox();
  sb.auth.getSession().then(({data})=>syncUI(data?.session?.user||null)).catch(()=>syncUI(null));
  sb.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>syncUI(session?.user||null),0);});
})();

</script></body></html>
